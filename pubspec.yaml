name: anime_stream
description: "DEEN - A premium dark iOS-style anime streaming application."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  wakelock_plus: ^1.2.8
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.0
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1
  startapp_sdk: ^1.0.1
  collection: ^1.19.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
